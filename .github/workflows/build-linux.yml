name: Linux build

on: [push, pull_request]

jobs:
  precheks:
    name:    Linux -> Pre-checks
    runs-on: ubuntu-26.04

    steps:
    - name: Clone DiligentCore
      uses: actions/checkout@v6
      with:
        repository: DiligentGraphics/DiligentCore
        path:       DiligentCore

    - name: Clone DiligentFX
      uses: actions/checkout@v6
      with:
        path: DiligentFX

    - name: Format validation
      shell: bash
      working-directory: ${{github.workspace}}/DiligentFX/BuildTools/FormatValidation
      run: ./validate_format_linux.sh

    - name: Codespell
      uses: codespell-project/actions-codespell@master
      with:
        check_filenames: true
        ignore_words_file: ./DiligentFX/.github/.codespellignore
        skip: ./DiligentFX/.git,./DiligentFX/ThirdParty
        path: ./DiligentFX

        
  build:
    needs:   precheks
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        name:       ["GCC", "Clang"]
        build_type: ["Debug", "Release"]
        cmake_args: ["-DDILIGENT_BUILD_FX_INCLUDE_TEST=ON -DDILIGENT_BUILD_FX_TESTS=ON"]
        include:
          - name:            "GCC"
            cmake_generator: "Unix Makefiles"
            cc:              "gcc-14"
            cxx:             "g++-14"

          - name:            "Clang"
            cmake_generator: "Ninja"
            cc:              "clang-22"
            cxx:             "clang++-22"

          - name:            "Clang-ASAN"
            build_type:      "RelWithDebInfo"
            cmake_generator: "Ninja"
            cmake_args:      "-DDILIGENT_BUILD_FX_TESTS=ON"
            sanitizer:       "address"
            cc:              "clang-22"
            cxx:             "clang++-22"

          - name:            "Clang-TSAN"
            build_type:      "RelWithDebInfo"
            cmake_generator: "Ninja"
            cmake_args:      "-DDILIGENT_BUILD_FX_TESTS=ON"
            sanitizer:       "thread"
            cc:              "clang-22"
            cxx:             "clang++-22"

    name: Linux -> ${{ matrix.name }}-x64, ${{ matrix.build_type }}

    steps:
    - name: Checkout
      uses: DiligentGraphics/github-action/checkout@v35

    - name: Set up build environment
      if:   success()
      uses: DiligentGraphics/github-action/setup-build-env@v35
      with:
        platform:        Linux
        cmake-generator: ${{ matrix.cmake_generator }}

    # Run generic marshalling and real Radient Java integration in one host-JVM job.
    - name: Set up Java binding test dependencies
      if: matrix.name == 'Clang' && matrix.build_type == 'Debug'
      shell: bash
      run: |
        # Reuse LLVM 22 and the JDK already installed on the runner.
        echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
        echo "RADIENT_JAVA_CMAKE_ARGS=-DRADIENT_BUILD_JAVA_BINDINGS=ON -DRADIENT_BINDINGS_PYTHON_EXECUTABLE=$RUNNER_TEMP/bindings-venv/bin/python -DRADIENT_BINDINGS_LIBCLANG=/usr/lib/llvm-22/lib/libclang-22.so.1" >> "$GITHUB_ENV"
        python3 -m venv "$RUNNER_TEMP/bindings-venv"
        "$RUNNER_TEMP/bindings-venv/bin/python" -m pip install -r DiligentFX/BuildTools/Bindings/requirements.txt

    - name: Build Java binding tests
      if: matrix.name == 'Clang' && matrix.build_type == 'Debug'
      shell: bash
      env:
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -S DiligentFX/BuildTools/Bindings/java -B "$RUNNER_TEMP/binding-java" -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBINDINGS_PYTHON_EXECUTABLE="$RUNNER_TEMP/bindings-venv/bin/python" \
          -DBINDINGS_LIBCLANG=/usr/lib/llvm-22/lib/libclang-22.so.1
        cmake --build "$RUNNER_TEMP/binding-java" --parallel "$(nproc)"

    - name: Test Java bindings
      if: matrix.name == 'Clang' && matrix.build_type == 'Debug'
      shell: bash
      run: ctest --test-dir "$RUNNER_TEMP/binding-java" --verbose --output-on-failure --no-tests=error

    - name: Configure CMake
      if:   success()
      uses: DiligentGraphics/github-action/configure-cmake@v35
      with:
        cc:         ${{ matrix.cc }}
        cxx:        ${{ matrix.cxx }}
        generator:  ${{ matrix.cmake_generator }}
        build-type: ${{ matrix.build_type }}
        cmake-args: ${{ matrix.cmake_args }} ${{ env.RADIENT_JAVA_CMAKE_ARGS }}
        sanitizer:  ${{ matrix.sanitizer }}

    - name: Build
      id:   build
      if: success()
      uses: DiligentGraphics/github-action/build@v35

    # The main build produces the JNI library and Java classes using the same Radient target.
    - name: Test Radient Java bindings
      if: matrix.name == 'Clang' && matrix.build_type == 'Debug'
      shell: bash
      run: ctest --test-dir "${{ runner.workspace }}/build/DiligentFX/Radient/bindings/java/tests" --verbose --output-on-failure --no-tests=error

    - name: RadientTest
      if:   success()
      uses: DiligentGraphics/github-action/run-radient-tests@v35

    - name: DiligentFXGPUTest VK
      if:   ${{ success() || failure() && steps.build.outcome == 'success' }}
      uses: DiligentGraphics/github-action/run-fx-gpu-tests@v35
      with:
        mode: vk_sw

    - name: DiligentFXGPUTest GL
      if:   ${{ success() || failure() && steps.build.outcome == 'success' }}
      uses: DiligentGraphics/github-action/run-fx-gpu-tests@v35
      with:
        mode: gl

    - name: RadientGPUTest VK
      # NB: it is essential to include failure() to override the default status check of success()
      #     that is automatically applied to if conditions that don't contain a status check function.
      if:   ${{ success() || failure() && steps.build.outcome == 'success' }}
      uses: DiligentGraphics/github-action/run-radient-gpu-tests@v35
      with:
        mode: vk_sw

    - name: RadientGPUTest GL
      if:   ${{ success() || failure() && steps.build.outcome == 'success' }}
      uses: DiligentGraphics/github-action/run-radient-gpu-tests@v35
      with:
        mode: gl

    - name: Clone Radient Test Data
      id: radient_test_data
      if: ${{ (success() || failure()) && steps.build.outcome == 'success' }}
      uses: actions/checkout@v6
      with:
        repository: DiligentGraphics/DiligentTestData
        ref:        radient
        path:       RadientTestData

    - name: Clone glTF Sample Assets
      id: gltf_sample_assets
      if: ${{ (success() || failure()) && steps.build.outcome == 'success' }}
      uses: actions/checkout@v6
      with:
        repository: KhronosGroup/glTF-Sample-Assets
        ref:        ${{env.DILIGENT_GLTF_SAMPLE_ASSETS_COMMIT}}
        path:       glTF-Sample-Assets

    - name: RadientRenderTest VK
      if: ${{ (success() || failure()) && steps.build.outcome == 'success' && steps.radient_test_data.outcome == 'success' && steps.gltf_sample_assets.outcome == 'success' }}
      uses: DiligentGraphics/github-action/run-radient-render-tests@v35
      with:
        mode:                 vk_sw
        models-path:          ${{github.workspace}}/glTF-Sample-Assets
        assets-path:          ${{github.workspace}}/RadientTestData
        update-golden-images: true

    - name: Upload Radient Render Images
      if: ${{ always() && !cancelled() && steps.build.outcome == 'success' && steps.radient_test_data.outcome == 'success' && steps.gltf_sample_assets.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: RadientRenderImages-Linux-${{matrix.name}}-${{matrix.build_type}}
        path: |
          RadientTestData/GoldenImages/**/*_vk.png
          RadientTestData/GoldenImages/**/*_gl.png
          RadientTestData/GoldenImagesDifferences
        if-no-files-found: error
